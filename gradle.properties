org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP does not support AGP 9's built-in Kotlin compilation (google/ksp#2615), and Room's
# annotation processor runs on KSP. Built-in Kotlin is therefore OFF and org.jetbrains.kotlin.android
# is applied explicitly in :app, :data and :ui. Removing this line silently disables Room codegen.
# AGP 10 removes this opt-out entirely — revisit when KSP ships built-in-Kotlin support.
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
