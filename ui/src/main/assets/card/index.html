<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div id="card" class="no-photo">
    <img id="photo" alt="" hidden>
    <div id="top-scrim"></div>
    <div id="bottom-scrim"></div>
    <header id="top">
        <div id="brand"></div>
        <div id="name" class="fit single" hidden></div>
    </header>
    <main id="details">
        <div id="result" class="badge">
            <span id="result-symbol" aria-hidden="true"></span>
            <span id="result-label"></span>
        </div>
        <div id="meta" class="fit"></div>
        <h1 id="opponents" class="fit clamp" hidden></h1>
        <div id="partner" class="fit" hidden></div>
        <div id="score" class="fit" hidden></div>
        <div id="location" class="fit single" hidden></div>
        <div id="streak" class="fit" hidden></div>
    </main>
</div>
<script src="card.js"></script>
</body>
</html>
